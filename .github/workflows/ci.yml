name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:9.5
        env:
          POSTGRES_DB: bottrader
          POSTGRES_USER: bottrader
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bottrader -d bottrader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg2://bottrader:change_me@127.0.0.1:5432/bottrader
      TRADING_MODE: PAPER

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m compileall -q app
      - run: pytest -q
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
