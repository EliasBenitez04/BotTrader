services:
  db:
    image: postgres:9.5
    environment:
      POSTGRES_DB: bottrader
      POSTGRES_USER: bottrader
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - bottrader_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottrader -d bottrader"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://bottrader:change_me@db:5432/bottrader
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://bottrader:change_me@db:5432/bottrader
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://bottrader:change_me@db:5432/bottrader
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["worker"]

volumes:
  bottrader_pgdata:
